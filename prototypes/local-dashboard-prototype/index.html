<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Migration Dashboard — Throwaway Prototype</title>
  <!-- Three radically different dashboard variants, switchable via ?variant=, on a standalone prototype route. -->
  <style>
    :root {
      --ink: #16221d;
      --muted: #64716b;
      --paper: #f4f1e8;
      --panel: #fffdf7;
      --line: #d9d5c9;
      --accent: #f2613f;
      --accent-dark: #9f2d19;
      --green: #236447;
      --green-soft: #dceadf;
      --amber: #9a5a06;
      --amber-soft: #f5e4b6;
      --red: #a9332a;
      --blue: #2449a4;
      --shadow: 0 18px 50px rgba(22, 34, 29, .12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: .9em; }
    .prototype-flag {
      position: fixed; top: 12px; right: 16px; z-index: 50;
      padding: 7px 10px; border-radius: 999px; background: #1d1713; color: #fff;
      font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
    }
    .eyebrow { color: var(--accent-dark); font-size: 11px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .button {
      border: 1px solid var(--ink); border-radius: 9px; padding: 10px 14px;
      background: var(--ink); color: white; font-weight: 750;
    }
    .button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
    .button.accent { background: var(--accent); border-color: var(--accent); color: #24120d; }
    .button.danger { background: var(--red); border-color: var(--red); }
    .button.small { padding: 7px 10px; font-size: 12px; }
    .pill { display: inline-flex; gap: 6px; align-items: center; padding: 5px 9px; border-radius: 999px; background: #ece8dc; font-size: 12px; font-weight: 720; }
    .pill.ok { background: var(--green-soft); color: var(--green); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.fail { background: #f3d6d3; color: var(--red); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .progress { height: 8px; overflow: hidden; border-radius: 99px; background: #ddd8ca; }
    .progress > span { display: block; height: 100%; width: var(--progress); background: var(--accent); transition: width .25s ease; }
    .state-dump { margin-top: 18px; border: 1px dashed #9d988b; border-radius: 10px; background: rgba(255,255,255,.58); }
    .state-dump summary { cursor: pointer; padding: 10px 12px; font-weight: 800; font-size: 12px; }
    .state-dump pre { max-height: 260px; overflow: auto; margin: 0; padding: 0 12px 12px; font-size: 11px; white-space: pre-wrap; }

    /* Variant A: a calm, linear guided run. */
    .guided { min-height: 100vh; padding: 38px 48px 110px; background: linear-gradient(135deg, #f4f1e8 0%, #ebe5d6 100%); }
    .guided-shell { max-width: 1120px; margin: 0 auto; }
    .guided-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .guided-header h1 { margin: 6px 0 0; font: 750 42px/1.05 Georgia, serif; letter-spacing: -.035em; }
    .guided-profile { min-width: 285px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,253,247,.78); }
    .guided-profile select { width: 100%; margin-top: 7px; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .stepper { display: grid; grid-template-columns: repeat(5, 1fr); margin-bottom: 18px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
    .step { min-height: 76px; padding: 14px; border-right: 1px solid var(--line); }
    .step:last-child { border-right: 0; }
    .step strong { display: block; margin-top: 6px; font-size: 13px; }
    .step.active { background: #fff1dd; box-shadow: inset 0 -4px var(--accent); }
    .step.done { background: var(--green-soft); }
    .guided-main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; }
    .paper-card { padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 8px 25px rgba(22,34,29,.05); }
    .paper-card h2 { margin: 2px 0 8px; font: 750 25px/1.2 Georgia, serif; }
    .action-choice { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 10px 0; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
    .action-choice.selected { border: 2px solid var(--accent); background: #fff7ee; }
    .action-choice h3 { margin: 0 0 4px; font-size: 15px; }
    .review-list { display: grid; gap: 10px; margin: 18px 0; }
    .review-row { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .review-row strong { text-align: right; }
    .guided-aside { display: flex; flex-direction: column; gap: 18px; }
    .event { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }

    /* Variant B: dense tri-pane operations console. */
    .console { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(500px, 1fr) 340px; background: #111715; color: #e7eee9; padding-bottom: 90px; }
    .console .muted { color: #94a19b; }
    .console-nav { padding: 24px 16px; border-right: 1px solid #2c3632; background: #0c110f; }
    .console-brand { margin: 4px 8px 24px; font-size: 17px; font-weight: 850; }
    .nav-label { margin: 22px 8px 8px; color: #728079; font-size: 10px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    .nav-item { width: 100%; display: flex; justify-content: space-between; padding: 10px 11px; border: 0; border-radius: 7px; background: transparent; color: #cdd7d1; text-align: left; }
    .nav-item.active { background: #23302b; color: #fff; box-shadow: inset 3px 0 #64d49a; }
    .console-main { padding: 24px; }
    .console-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .console-top h1 { margin: 4px 0 0; font-size: 24px; }
    .console-card { margin-bottom: 16px; border: 1px solid #303b36; border-radius: 9px; background: #171f1c; }
    .console-card header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #303b36; }
    .console-card header h2 { margin: 0; font-size: 13px; }
    .console-card .body { padding: 14px; }
    .action-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .action-table th, .action-table td { padding: 10px; border-bottom: 1px solid #2b3531; text-align: left; }
    .action-table tr.selected { background: #203128; }
    .mapping-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #303b36; background: #131a17; }
    .mapping-source { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .mapping-source code { overflow: hidden; color: #dce6e0; text-overflow: ellipsis; white-space: nowrap; }
    .mapping-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .mapping-table th { padding: 8px 10px; color: #84928b; font-size: 10px; letter-spacing: .1em; text-align: left; text-transform: uppercase; }
    .mapping-table td { padding: 9px 10px; border-top: 1px solid #29322e; vertical-align: middle; }
    .mapping-table tr:hover { background: #1b2521; }
    .mapping-table select { width: 100%; min-width: 140px; padding: 8px 28px 8px 8px; border: 1px solid #3a4741; border-radius: 6px; background: #101613; color: #e7eee9; }
    .mapping-table select.unmapped { border-color: #a86125; color: #f0bd7c; }
    .mapping-arrow { color: #64d49a; font-size: 16px; font-weight: 900; text-align: center; }
    .sample-value { display: block; max-width: 160px; overflow: hidden; color: #92a098; font-family: "SFMono-Regular", Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .mapping-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 12px; border: 1px solid #303b36; border-radius: 7px; background: #0d1210; font-size: 11px; }
    .mapping-preview span { color: #84928b; }
    .mapping-preview strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .metafield-builder { display: grid; grid-template-columns: 1.25fr .8fr 1fr 1fr 1.15fr auto; gap: 8px; align-items: end; padding: 12px 14px; border-bottom: 1px solid #303b36; background: #101613; }
    .metafield-builder[hidden] { display: none; }
    .metafield-builder label { display: block; color: #84928b; font-size: 9px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .metafield-builder input, .metafield-builder select { width: 100%; margin-top: 5px; padding: 8px; border: 1px solid #3a4741; border-radius: 6px; background: #171f1c; color: #e7eee9; }
    .metafield-destination { display: block; max-width: 270px; overflow: hidden; color: #b8f1d2; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .console .button { border-color: #46554e; background: #25312c; }
    .console .button.accent { background: #64d49a; color: #08110d; border-color: #64d49a; }
    .console-inspector { padding: 24px 18px 110px; border-left: 1px solid #2c3632; background: #131a17; }
    .inspector-section { margin-bottom: 22px; }
    .inspector-section h3 { margin: 0 0 10px; color: #8f9e96; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .kv { display: grid; grid-template-columns: 105px 1fr; gap: 9px; padding: 6px 0; font-size: 12px; }
    .console-log { height: 210px; overflow: auto; padding: 12px; border-radius: 6px; background: #090d0b; font: 11px/1.55 "SFMono-Regular", Consolas, monospace; }
    .console-log div { margin-bottom: 5px; }

    /* Variant C: action-first workspace with a command deck. */
    .workspace { min-height: 100vh; padding: 28px 34px 110px; background: #eef2f7; color: #1e293b; }
    .workspace-shell { max-width: 1320px; margin: auto; }
    .workspace-header { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border: 1px solid #d7deea; border-radius: 15px; background: white; box-shadow: 0 8px 30px rgba(40,55,80,.06); }
    .workspace-header h1 { margin: 0; font-size: 19px; }
    .workspace-header select { min-width: 230px; padding: 9px 10px; border: 1px solid #cdd6e4; border-radius: 8px; background: white; }
    .workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; margin-top: 18px; }
    .workspace-panel { border: 1px solid #d7deea; border-radius: 15px; background: white; box-shadow: 0 8px 30px rgba(40,55,80,.05); }
    .workspace-panel > header { padding: 17px 19px; border-bottom: 1px solid #e1e7f0; }
    .workspace-panel > header h2 { margin: 0 0 4px; font-size: 16px; }
    .action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 17px; }
    .action-tile { min-height: 145px; padding: 16px; border: 1px solid #dbe2ed; border-radius: 12px; background: #f9fbfe; text-align: left; color: #1e293b; }
    .action-tile.selected { border: 2px solid #4769de; background: #eef2ff; box-shadow: 0 0 0 3px rgba(71,105,222,.11); }
    .action-tile h3 { margin: 12px 0 5px; font-size: 15px; }
    .tile-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: #dfe6ff; color: #3552b6; font-weight: 900; }
    .command-deck { padding: 18px; }
    .command-step { position: relative; padding: 0 0 20px 30px; }
    .command-step::before { content: ""; position: absolute; left: 9px; top: 19px; bottom: 0; width: 1px; background: #d5ddea; }
    .command-step:last-child::before { display: none; }
    .command-node { position: absolute; left: 0; top: 1px; display: grid; place-items: center; width: 19px; height: 19px; border: 1px solid #aebbd0; border-radius: 50%; background: white; font-size: 10px; font-weight: 900; }
    .command-step.done .command-node { background: #2f8d63; border-color: #2f8d63; color: white; }
    .command-step.active .command-node { background: #4769de; border-color: #4769de; color: white; }
    .command-step h3 { margin: 0 0 5px; font-size: 13px; }
    .result-card { margin-top: 16px; padding: 15px; border: 1px solid #b9d8c8; border-radius: 11px; background: #eef9f3; }

    .profile-editor {
      position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px;
      background: rgba(12,17,15,.62); backdrop-filter: blur(5px);
    }
    .profile-editor[hidden] { display: none; }
    .editor-card { width: min(620px, 100%); padding: 24px; border-radius: 16px; background: white; color: var(--ink); box-shadow: var(--shadow); }
    .editor-card h2 { margin: 0 0 5px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin: 20px 0; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .field input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    .editor-actions { display: flex; justify-content: flex-end; gap: 9px; }

    .switcher {
      position: fixed; z-index: 100; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; padding: 8px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
      background: #090d0b; color: white; box-shadow: 0 14px 40px rgba(0,0,0,.3);
    }
    .switcher button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #27302c; color: white; font-size: 18px; }
    .switcher-label { min-width: 185px; text-align: center; font-size: 12px; font-weight: 850; }

    @media (max-width: 900px) {
      .guided { padding: 26px 18px 105px; }
      .guided-header, .guided-main, .workspace-grid { display: block; }
      .guided-profile, .guided-aside, .workspace-panel { margin-top: 16px; }
      .stepper { grid-template-columns: 1fr; }
      .step { border-right: 0; border-bottom: 1px solid var(--line); min-height: auto; }
      .console { grid-template-columns: 1fr; }
      .console-nav, .console-inspector { border: 0; }
      .console-nav { display: none; }
      .action-grid { grid-template-columns: 1fr; }
      .metafield-builder { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="prototype-flag">Throwaway prototype</div>
  <main id="app"></main>
  <div id="editor" class="profile-editor" hidden></div>
  <div id="switcher"></div>

  <script>
    const variants = {
      A: "Guided run",
      B: "Operations console",
      C: "Action workspace",
    };

    const profiles = {
      dragonslair: { id: "dragonslair", name: "Dragons Lair", source: "Vendre", endpoint: "https://api.vendre.example", secret: "DRAGONSLAIR_VENDRE_API_KEY", status: "Ready" },
      micki: { id: "micki", name: "Micki", source: "Vendre", endpoint: "https://micki.vendre.example", secret: "MICKI_VENDRE_API_KEY", status: "Ready" },
      fyrklovern: { id: "fyrklovern", name: "Fyrklövern", source: "Norce", endpoint: "https://storeapi.norce.example", secret: "FYRKLOVERN_NORCE_TOKEN", status: "Needs review" },
    };

    const actions = {
      productExport: { id: "product-export", name: "Acquire product data", note: "Create a versioned Source Dataset from the selected source.", output: "Source Dataset", risk: "Read-only" },
      matrixifyProducts: { id: "matrixify-products", name: "Build Matrixify products", note: "Transform retained product data into a reviewable workbook.", output: "Matrixify workbook", risk: "Artifact write" },
      validate: { id: "validate-source", name: "Validate source", note: "Run profile resolution and Preflight without creating migration outputs.", output: "Validation report", risk: "Read-only" },
      topup: { id: "product-top-up", name: "Prepare product top-up", note: "Compare source and Shopify exports, then prepare only missing products.", output: "Top-up workbook", risk: "Artifact write" },
    };

    const matrixifyFields = [
      "— Not mapped —", "Handle", "Title", "Body HTML", "Vendor", "Type", "Tags",
      "Option1 Name", "Option1 Value", "Variant SKU", "Variant Barcode", "Variant Price",
      "Variant Compare At Price", "Image Src", "SEO Title", "SEO Description",
    ];

    const transformRules = ["Direct", "Trim", "HTML clean", "Lookup table", "Join values", "Fallback", "Derived"];
    const metafieldTypes = ["single_line_text_field", "multi_line_text_field", "number_integer", "number_decimal", "boolean", "json", "url", "date", "date_time"];

    const mappingTemplates = {
      dragonslair: [
        ["articleNumber", "DL-10482-BLK-M", "Trim", "Variant SKU", "required"],
        ["name", "Dragon Shield Matte Black", "Trim", "Title", "required"],
        ["descriptionHtml", "<p>Protective sleeves…", "HTML clean", "Body HTML", "optional"],
        ["manufacturer.name", "Arcane Tinmen", "Direct", "Vendor", "optional"],
        ["gtin", "5706569104823", "Trim", "Variant Barcode", "optional"],
        ["specifications.Color", "Black", "Lookup table", "Option1 Value", "optional"],
        ["price.includingVat", "119.00", "Direct", "Variant Price", "required"],
        ["meta.shortDescription", "Matte card sleeves", "Direct", "Metafield: custom.short_description [single_line_text_field]", "optional", "metafield"],
      ],
      micki: [
        ["article_number", "10218800", "Trim", "Variant SKU", "required"],
        ["product_name", "Rubens Barn Tummies", "Trim", "Title", "required"],
        ["long_description", "Soft handmade doll…", "HTML clean", "Body HTML", "optional"],
        ["brand", "Rubens Barn", "Direct", "Vendor", "optional"],
        ["ean", "7350023981880", "Trim", "Variant Barcode", "optional"],
        ["colour", "Multicolor", "Lookup table", "Option1 Value", "optional"],
        ["sales_price", "499.00", "Direct", "Variant Price", "required"],
        ["internal_category", "Dolls / Soft", "Direct", "Metafield: custom.source_category [single_line_text_field]", "optional", "metafield"],
      ],
      fyrklovern: [
        ["PartNo", "100233", "Trim", "Variant SKU", "required"],
        ["Name.sv-SE", "Nordic Sand Tallrik", "Fallback", "Title", "required"],
        ["Description.sv-SE", "<p>Stengods…", "HTML clean", "Body HTML", "optional"],
        ["Brand.Name", "Broste Copenhagen", "Direct", "Vendor", "optional"],
        ["EAN", "5710688195072", "Trim", "Variant Barcode", "optional"],
        ["Variant.Color", "Nordic Sand", "Lookup table", "Option1 Value", "optional"],
        ["Price.SE.SEK", "189.00", "Direct", "Variant Price", "required"],
        ["MarketVisibility", "SE, NO, DK", "Join values", "Metafield: custom.market_visibility [single_line_text_field]", "optional", "metafield"],
      ],
    };

    const profileMappings = Object.fromEntries(Object.entries(mappingTemplates).map(([profileId, rows]) => [
      profileId,
      rows.map((row, index) => ({ id: `${profileId}-${index}`, source: row[0], sample: row[1], transform: row[2], destination: row[3], requirement: row[4], kind: row[5] || "standard" })),
    ]));

    const state = {
      profileId: "dragonslair",
      actionKey: "matrixifyProducts",
      stage: "draft",
      progress: 0,
      runId: null,
      attempt: 0,
      editing: false,
      mappingStatus: "draft",
      metafieldEditorOpen: false,
      editingMetafieldId: null,
      events: [
        { time: "10:24:01", type: "system", text: "Migration Data Root verified" },
        { time: "10:24:02", type: "profile", text: "3 Store Profiles discovered" },
      ],
      result: null,
    };

    let runTimer = null;

    function currentVariant() {
      const value = new URLSearchParams(location.search).get("variant") || "A";
      return variants[value] ? value : "A";
    }

    function profile() { return profiles[state.profileId]; }
    function action() { return actions[state.actionKey]; }
    function mappings() { return profileMappings[state.profileId]; }
    function stageRank() { return ["draft", "prepared", "running", "succeeded", "failed", "cancelled"].indexOf(state.stage); }
    function isAtLeast(stage) { return stageRank() >= ["draft", "prepared", "running", "succeeded"].indexOf(stage); }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]); }

    function profileOptions() {
      return Object.values(profiles).map(item => `<option value="${item.id}" ${item.id === state.profileId ? "selected" : ""}>${item.name} · ${item.source}</option>`).join("");
    }

    function statusPill() {
      if (state.stage === "succeeded") return `<span class="pill ok"><span class="dot"></span>Succeeded</span>`;
      if (state.stage === "running") return `<span class="pill warn"><span class="dot"></span>Executing ${state.progress}%</span>`;
      if (state.stage === "failed" || state.stage === "cancelled") return `<span class="pill fail"><span class="dot"></span>${state.stage}</span>`;
      if (state.stage === "prepared") return `<span class="pill ok"><span class="dot"></span>Plan ready</span>`;
      return `<span class="pill"><span class="dot"></span>Draft</span>`;
    }

    function stateJson() {
      return escapeHtml(JSON.stringify({
        variant: currentVariant(),
        storeProfile: profile(),
        action: action(),
        fieldMappings: mappings(),
        run: { stage: state.stage, progress: state.progress, runId: state.runId, attempt: state.attempt },
        result: state.result,
      }, null, 2));
    }

    function stateDump(open = false) {
      return `<details class="state-dump" ${open ? "open" : ""}><summary>Prototype state · inspect everything</summary><pre>${stateJson()}</pre></details>`;
    }

    function eventsHtml(limit = 8) {
      return state.events.slice(-limit).reverse().map(event => `<div class="event"><code>${event.time}</code><span>${escapeHtml(event.text)}</span></div>`).join("");
    }

    function actionsList() {
      return Object.entries(actions).map(([key, item]) => `
        <div class="action-choice ${key === state.actionKey ? "selected" : ""}">
          <div><h3>${item.name}</h3><div class="muted">${item.note}</div></div>
          <button class="button small ${key === state.actionKey ? "accent" : "secondary"}" data-action="${key}">${key === state.actionKey ? "Selected" : "Choose"}</button>
        </div>`).join("");
    }

    function mappingOptions(current) {
      const fields = matrixifyFields.includes(current) ? matrixifyFields : [...matrixifyFields, current];
      return fields.map(field => `<option ${field === current ? "selected" : ""}>${field}</option>`).join("");
    }

    function transformOptions(current) {
      return transformRules.map(rule => `<option ${rule === current ? "selected" : ""}>${rule}</option>`).join("");
    }

    function mappingTable() {
      return mappings().map(row => {
        const unmapped = row.destination === "— Not mapped —";
        const invalid = unmapped && row.requirement === "required";
        return `<tr>
          <td><strong class="mono">${row.source}</strong><small class="sample-value" title="${escapeHtml(row.sample)}">${escapeHtml(row.sample)}</small></td>
          <td><select data-map-transform="${row.id}">${transformOptions(row.transform)}</select></td>
          <td class="mapping-arrow">→</td>
          <td>${row.kind === "metafield" ? `<span class="metafield-destination" title="${escapeHtml(row.destination)}">${escapeHtml(row.destination)}</span><button class="link-button" data-edit-metafield="${row.id}">Edit definition</button>` : `<select class="${unmapped ? "unmapped" : ""}" data-map-destination="${row.id}">${mappingOptions(row.destination)}</select>`}</td>
          <td>${invalid ? `<span class="pill fail">Required</span>` : unmapped ? `<span class="pill warn">Ignored</span>` : `<span class="pill ok">Mapped</span>`}</td>
        </tr>`;
      }).join("");
    }

    function mappingSummary() {
      const mapped = mappings().filter(row => row.destination !== "— Not mapped —").length;
      const missingRequired = mappings().filter(row => row.requirement === "required" && row.destination === "— Not mapped —").length;
      return { mapped, total: mappings().length, missingRequired };
    }

    function mappedSample(destination) {
      const row = mappings().find(item => item.destination === destination);
      return row ? escapeHtml(row.sample) : "Not mapped";
    }

    function metafieldBuilder() {
      const editingRow = mappings().find(row => row.id === state.editingMetafieldId);
      const parsed = editingRow?.destination.match(/^(Variant )?Metafield: ([^.]+)\.([^ ]+) \[([^\]]+)\]$/);
      const draft = { source: editingRow?.source || mappings()[0].source, owner: parsed?.[1] ? "Variant" : "Product", namespace: parsed?.[2] || "custom", key: parsed?.[3] || "material", type: parsed?.[4] || "single_line_text_field" };
      const sourceOptions = mappings().map(row => `<option value="${escapeHtml(row.source)}" ${row.source === draft.source ? "selected" : ""}>${escapeHtml(row.source)} · ${escapeHtml(row.sample)}</option>`).join("");
      return `<div class="metafield-builder" ${state.metafieldEditorOpen ? "" : "hidden"}>
        <label>Imported source field<select id="metafield-source" ${editingRow ? "disabled" : ""}>${sourceOptions}</select></label>
        <label>Owner<select id="metafield-owner"><option ${draft.owner === "Product" ? "selected" : ""}>Product</option><option ${draft.owner === "Variant" ? "selected" : ""}>Variant</option></select></label>
        <label>Namespace<input id="metafield-namespace" value="${escapeHtml(draft.namespace)}" placeholder="custom"></label>
        <label>Key<input id="metafield-key" value="${escapeHtml(draft.key)}" placeholder="material"></label>
        <label>Shopify type<select id="metafield-type">${metafieldTypes.map(type => `<option ${type === draft.type ? "selected" : ""}>${type}</option>`).join("")}</select></label>
        <div style="display:flex;gap:7px"><button class="button small accent" data-mapping="add-metafield">${editingRow ? "Save mapping" : "Add mapping"}</button><button class="button small" data-mapping="cancel-metafield">Cancel</button></div>
      </div>`;
    }

    function controls() {
      if (state.stage === "draft") return `<button class="button accent" data-command="prepare">Prepare Action Plan</button>`;
      if (state.stage === "prepared") return `<button class="button accent" data-command="run">Confirm & execute</button>`;
      if (state.stage === "running") return `<button class="button danger" data-command="cancel">Request cancellation</button>`;
      if (state.stage === "succeeded") return `<button class="button accent" data-command="results">Open results</button><button class="button secondary" data-command="new">Start another run</button>`;
      return `<button class="button accent" data-command="new">Start another run</button>`;
    }

    function guidedVariant() {
      const steps = [
        ["1", "Profile", true], ["2", "Action", true], ["3", "Review", isAtLeast("prepared")],
        ["4", "Execute", isAtLeast("running")], ["5", "Results", state.stage === "succeeded"],
      ];
      const active = state.stage === "draft" ? 1 : state.stage === "prepared" ? 2 : state.stage === "running" ? 3 : 4;
      return `<section class="guided"><div class="guided-shell">
        <header class="guided-header">
          <div><div class="eyebrow">Local migration dashboard</div><h1>Prepare a migration run</h1></div>
          <div class="guided-profile"><div class="eyebrow">Store Profile</div><select data-profile>${profileOptions()}</select><button class="button secondary small" style="margin-top:8px" data-edit>Edit reviewable settings</button></div>
        </header>
        <div class="stepper">${steps.map((step, index) => `<div class="step ${step[2] && index < active ? "done" : ""} ${index === active ? "active" : ""}"><span class="eyebrow">Step ${step[0]}</span><strong>${step[1]}</strong></div>`).join("")}</div>
        <div class="guided-main">
          <section class="paper-card">
            <div class="eyebrow">${state.stage === "draft" ? "Choose an Action" : "Prepared intent"}</div>
            <h2>${action().name}</h2><p class="muted">${action().note}</p>
            ${state.stage === "draft" ? actionsList() : `
              <div class="review-list">
                <div class="review-row"><span>Store Profile</span><strong>${profile().name} · ${profile().source}</strong></div>
                <div class="review-row"><span>Validation</span><strong>12 checks passed</strong></div>
                <div class="review-row"><span>Expected output</span><strong>${action().output}</strong></div>
                <div class="review-row"><span>Side effects</span><strong>${action().risk}</strong></div>
                <div class="review-row"><span>Plan fingerprint</span><strong class="mono">plan:9a3f…04c1</strong></div>
              </div>
              ${state.stage === "running" ? `<div class="progress" style="--progress:${state.progress}%"><span></span></div><p class="muted">${state.progress}% · processing product groups</p>` : ""}
              ${state.result ? `<div class="result-card"><strong>${state.result.summary}</strong><p>${state.result.output}</p></div>` : ""}
            `}
            <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:20px">${controls()}</div>
          </section>
          <aside class="guided-aside">
            <div class="paper-card"><div class="eyebrow">Run status</div><h2 style="margin-top:9px">${statusPill()}</h2><div class="review-list"><div class="review-row"><span>Profile status</span><strong>${profile().status}</strong></div><div class="review-row"><span>Run ID</span><strong class="mono">${state.runId || "Not created"}</strong></div></div></div>
            <div class="paper-card"><div class="eyebrow">Recent events</div>${eventsHtml(5)}</div>
          </aside>
        </div>${stateDump()}
      </div></section>`;
    }

    function consoleVariant() {
      const rows = Object.entries(actions).map(([key, item]) => `<tr class="${key === state.actionKey ? "selected" : ""}"><td><button class="nav-item" data-action="${key}">${item.name}</button></td><td>${item.risk}</td><td>${item.output}</td></tr>`).join("");
      const logs = state.events.map(event => `<div><span style="color:#6c7b74">${event.time}</span> <span style="color:#64d49a">${event.type.padEnd(8)}</span> ${escapeHtml(event.text)}</div>`).join("");
      const mapping = mappingSummary();
      return `<section class="console">
        <nav class="console-nav"><div class="console-brand">Migration control</div><div class="nav-label">Store Profiles</div>${Object.values(profiles).map(item => `<button class="nav-item ${item.id === state.profileId ? "active" : ""}" data-profile-button="${item.id}"><span>${item.name}</span><small>${item.source}</small></button>`).join("")}<div class="nav-label">Configuration</div><button class="nav-item active"><span>Field mappings</span><small>${mapping.mapped}/${mapping.total}</small></button><button class="nav-item"><span>Transformation policies</span></button><div class="nav-label">Records</div><button class="nav-item"><span>Recent runs</span><small>18</small></button><button class="nav-item"><span>Retained artifacts</span><small>42</small></button></nav>
        <main class="console-main">
          <header class="console-top"><div><div class="eyebrow" style="color:#64d49a">${profile().id} / operations</div><h1>${profile().name}</h1></div><div style="display:flex;gap:8px">${statusPill()}<button class="button small" data-edit>Edit profile</button></div></header>
          <section class="console-card"><header><h2>Action catalog</h2><span class="muted">Choose operator intent</span></header><div class="body" style="padding:0"><table class="action-table"><thead><tr><th>Action</th><th>Class</th><th>Produces</th></tr></thead><tbody>${rows}</tbody></table></div></section>
          <section class="console-card">
            <header><div><h2>Product field mapping</h2><span class="muted">Reviewable Store Profile settings · product-mapping.v1</span></div><span class="pill ${mapping.missingRequired ? "fail" : "ok"}">${mapping.mapped} of ${mapping.total} mapped</span></header>
            <div class="mapping-toolbar"><div class="mapping-source"><span class="pill">Imported export</span><code>${profile().source.toLowerCase()}-products-2026-11-13.json</code></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button small" data-mapping="new-metafield">+ Add metafield mapping</button><button class="button small" data-mapping="auto">Auto-map exact names</button><button class="button small accent" data-mapping="validate">Validate & save mapping</button></div></div>
            ${metafieldBuilder()}
            <div style="overflow:auto"><table class="mapping-table"><thead><tr><th>Imported source field & sample</th><th>Rule</th><th></th><th>Matrixify field</th><th>Status</th></tr></thead><tbody>${mappingTable()}</tbody></table></div>
          </section>
          <section class="console-card"><header><h2>Prepared plan</h2><span class="mono muted">plan:9a3f…04c1</span></header><div class="body"><div class="kv"><span class="muted">Action</span><strong>${action().name}</strong></div><div class="kv"><span class="muted">Capability</span><strong>products.v1</strong></div><div class="kv"><span class="muted">Validation</span><strong style="color:#64d49a">12 passed · 0 failed</strong></div><div class="kv"><span class="muted">Claims</span><strong>${profile().id}, products-output</strong></div><div class="progress" style="--progress:${state.progress}%"><span style="background:#64d49a"></span></div><div style="display:flex;gap:8px;margin-top:14px">${controls()}</div></div></section>
          <section class="console-card"><header><h2>Live Action Events</h2><span class="muted">attempt ${state.attempt || "—"}</span></header><div class="body"><div class="console-log">${logs}</div></div></section>
        </main>
        <aside class="console-inspector">
          <div class="inspector-section"><h3>Selection inspector</h3><div class="kv"><span class="muted">Profile</span><strong>${profile().id}</strong></div><div class="kv"><span class="muted">Source</span><strong>${profile().source}</strong></div><div class="kv"><span class="muted">Action</span><strong>${action().id}</strong></div><div class="kv"><span class="muted">Stage</span><strong>${state.stage}</strong></div></div>
          <div class="inspector-section"><h3>Effective settings</h3><div class="kv"><span class="muted">Endpoint</span><code>${profile().endpoint}</code></div><div class="kv"><span class="muted">Credential</span><code>${profile().secret}</code></div><div class="kv"><span class="muted">Request</span><span>3 retries · 30s</span></div></div>
          <div class="inspector-section"><h3>Mapping preview · first row</h3><div class="mapping-preview"><span>Variant SKU</span><strong>${mappedSample("Variant SKU")}</strong><span>Title</span><strong>${mappedSample("Title")}</strong><span>Vendor</span><strong>${mappedSample("Vendor")}</strong><span>Variant Price</span><strong>${mappedSample("Variant Price")}</strong>${mappings().filter(row => row.kind === "metafield").slice(0, 2).map(row => `<span title="${escapeHtml(row.destination)}">${escapeHtml(row.destination.replace(/ \[[^\]]+\]$/, ""))}</span><strong>${escapeHtml(row.sample)}</strong>`).join("")}</div><p class="muted" style="font-size:11px">Preview updates from imported sample values before an Action Plan is prepared.</p></div>
          <div class="inspector-section"><h3>Output</h3><div class="kv"><span class="muted">Expected</span><span>${action().output}</span></div><div class="kv"><span class="muted">Run</span><code>${state.runId || "not-created"}</code></div></div>
          ${stateDump(true)}
        </aside>
      </section>`;
    }

    function workspaceVariant() {
      const tiles = Object.entries(actions).map(([key, item], index) => `<button class="action-tile ${key === state.actionKey ? "selected" : ""}" data-action="${key}"><span class="tile-icon">${index + 1}</span><h3>${item.name}</h3><span class="muted">${item.note}</span></button>`).join("");
      const steps = [
        ["Profile resolved", true], ["Action selected", true], ["Plan reviewed", isAtLeast("prepared")],
        ["Execution", isAtLeast("running")], ["Results ready", state.stage === "succeeded"],
      ];
      return `<section class="workspace"><div class="workspace-shell">
        <header class="workspace-header"><div><div class="eyebrow" style="color:#4769de">Migration workspace</div><h1>What do you want to accomplish?</h1></div><div style="display:flex;gap:8px"><select data-profile>${profileOptions()}</select><button class="button secondary small" data-edit>Settings</button></div></header>
        <div class="workspace-grid">
          <section class="workspace-panel"><header><h2>Action catalog</h2><div class="muted">Actions express intent; implementation steps stay hidden.</div></header><div class="action-grid">${tiles}</div></section>
          <aside class="workspace-panel"><header><h2>Command deck</h2><div class="muted">${profile().name} · ${action().name}</div></header><div class="command-deck">
            ${steps.map((step, index) => `<div class="command-step ${step[1] ? "done" : index === (state.stage === "draft" ? 2 : state.stage === "prepared" ? 3 : 4) ? "active" : ""}"><span class="command-node">${step[1] ? "✓" : index + 1}</span><h3>${step[0]}</h3>${index === 2 ? `<div class="muted">12 checks · plan:9a3f…04c1</div>` : ""}${index === 3 && state.stage === "running" ? `<div class="progress" style="--progress:${state.progress}%"><span style="background:#4769de"></span></div>` : ""}</div>`).join("")}
            <div style="display:flex;gap:8px;flex-wrap:wrap">${controls()}</div>
            ${state.result ? `<div class="result-card"><strong>${state.result.summary}</strong><p>${state.result.output}</p><button class="button secondary small" data-command="results">Reveal artifact</button></div>` : ""}
          </div></aside>
        </div>
        <div class="workspace-grid" style="grid-template-columns:1fr 1fr"><section class="workspace-panel"><header><h2>Validation & claims</h2></header><div class="command-deck"><div class="review-row"><span>Profile schema</span><strong style="color:#2f8d63">Valid</strong></div><div class="review-row"><span>Preflight</span><strong style="color:#2f8d63">Connected</strong></div><div class="review-row"><span>Exclusive output claim</span><strong>${profile().id}/products</strong></div></div></section><section class="workspace-panel"><header><h2>Latest events</h2></header><div class="command-deck">${eventsHtml(4)}</div></section></div>
        ${stateDump()}
      </div></section>`;
    }

    function renderEditor() {
      const editor = document.querySelector("#editor");
      editor.hidden = !state.editing;
      if (!state.editing) { editor.innerHTML = ""; return; }
      editor.innerHTML = `<div class="editor-card"><div class="eyebrow">Store Profile · review view</div><h2>Edit ${profile().name}</h2><p class="muted">This prototype never reads or stores secret values. It edits the environment-variable reference only.</p><div class="field-grid"><div class="field"><label>Display name</label><input id="edit-name" value="${escapeHtml(profile().name)}"></div><div class="field"><label>Source system</label><input value="${profile().source}" disabled></div><div class="field"><label>HTTPS endpoint</label><input id="edit-endpoint" value="${escapeHtml(profile().endpoint)}"></div><div class="field"><label>Secret reference</label><input id="edit-secret" value="${escapeHtml(profile().secret)}"></div></div><div class="editor-actions"><button class="button secondary" data-editor="cancel">Cancel</button><button class="button accent" data-editor="save">Validate & save</button></div></div>`;
    }

    function renderSwitcher() {
      const variant = currentVariant();
      document.querySelector("#switcher").innerHTML = `<div class="switcher"><button aria-label="Previous variant" data-switch="-1">←</button><div class="switcher-label">${variant} · ${variants[variant]}</div><button aria-label="Next variant" data-switch="1">→</button></div>`;
    }

    function render() {
      const variant = currentVariant();
      document.querySelector("#app").innerHTML = variant === "B" ? consoleVariant() : variant === "C" ? workspaceVariant() : guidedVariant();
      renderEditor();
      renderSwitcher();
    }

    function timestamp() { return new Date().toTimeString().slice(0, 8); }
    function addEvent(type, text) { state.events.push({ time: timestamp(), type, text }); }
    function resetRun() { clearInterval(runTimer); state.stage = "draft"; state.progress = 0; state.runId = null; state.attempt = 0; state.result = null; addEvent("run", "Started a new draft invocation"); render(); }

    function prepare() {
      state.stage = "prepared";
      state.runId = `run-${new Date().toISOString().replace(/[-:.]/g, "").slice(0, 15)}Z-7K4P`;
      addEvent("plan", `Prepared ${action().name}; 12 validation checks passed`);
      render();
    }

    function run() {
      state.stage = "running"; state.progress = 6; state.attempt += 1; state.result = null;
      addEvent("attempt", `Execution Attempt ${state.attempt} started`); render();
      clearInterval(runTimer);
      runTimer = setInterval(() => {
        state.progress = Math.min(100, state.progress + 11 + Math.floor(Math.random() * 9));
        if (state.progress < 100) addEvent("progress", `${state.progress}% · processed source records`);
        if (state.progress >= 100) {
          clearInterval(runTimer); state.stage = "succeeded";
          state.result = { summary: "Action completed with 2 warnings", output: `${action().output} · 18.4 MB · sha256:8b31…f29a` };
          addEvent("result", "Canonical artifact verified and compatibility publication installed");
        }
        render();
      }, 650);
    }

    function cycleVariant(direction) {
      const keys = Object.keys(variants); const index = keys.indexOf(currentVariant());
      const next = keys[(index + direction + keys.length) % keys.length];
      const url = new URL(location.href); url.searchParams.set("variant", next); history.replaceState({}, "", url); render();
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action],[data-profile-button],[data-command],[data-edit],[data-editor],[data-switch],[data-mapping],[data-edit-metafield]");
      if (!target) return;
      if (target.dataset.action) { state.actionKey = target.dataset.action; resetRun(); return; }
      if (target.dataset.profileButton) { state.profileId = target.dataset.profileButton; resetRun(); return; }
      if (target.dataset.edit !== undefined) { state.editing = true; renderEditor(); return; }
      if (target.dataset.switch) { cycleVariant(Number(target.dataset.switch)); return; }
      if (target.dataset.editMetafield) {
        state.editingMetafieldId = target.dataset.editMetafield;
        state.metafieldEditorOpen = true;
        render(); return;
      }
      if (target.dataset.mapping === "new-metafield") {
        state.editingMetafieldId = null;
        state.metafieldEditorOpen = true;
        render(); return;
      }
      if (target.dataset.mapping === "cancel-metafield") {
        state.editingMetafieldId = null;
        state.metafieldEditorOpen = false;
        render(); return;
      }
      if (target.dataset.mapping === "add-metafield") {
        const namespace = document.querySelector("#metafield-namespace").value.trim();
        const key = document.querySelector("#metafield-key").value.trim();
        if (!/^[A-Za-z0-9_-]+$/.test(namespace) || !/^[A-Za-z0-9_-]+$/.test(key)) {
          alert("Namespace and key may contain letters, numbers, underscores, and hyphens."); return;
        }
        const source = document.querySelector("#metafield-source").value;
        const owner = document.querySelector("#metafield-owner").value;
        const type = document.querySelector("#metafield-type").value;
        const row = mappings().find(item => item.id === state.editingMetafieldId) || mappings().find(item => item.source === source);
        row.destination = `${owner === "Variant" ? "Variant " : ""}Metafield: ${namespace}.${key} [${type}]`;
        row.kind = "metafield";
        state.metafieldEditorOpen = false;
        state.editingMetafieldId = null;
        state.mappingStatus = "changed";
        addEvent("mapping", `${row.source} now maps to ${row.destination}`);
        render(); return;
      }
      if (target.dataset.mapping === "auto") {
        const fallbacks = ["SEO Description", "Tags", "Type"];
        mappings().filter(row => row.destination === "— Not mapped —").forEach((row, index) => { if (index < fallbacks.length) row.destination = fallbacks[index]; });
        state.mappingStatus = "changed"; addEvent("mapping", "Auto-mapped compatible source fields; review required"); render(); return;
      }
      if (target.dataset.mapping === "validate") {
        const summary = mappingSummary();
        state.mappingStatus = summary.missingRequired ? "invalid" : "valid";
        addEvent("mapping", summary.missingRequired ? `${summary.missingRequired} required mappings are missing` : `Validated and saved ${summary.mapped} field mappings`);
        render(); return;
      }
      if (target.dataset.editor === "cancel") { state.editing = false; renderEditor(); return; }
      if (target.dataset.editor === "save") {
        profile().name = document.querySelector("#edit-name").value;
        profile().endpoint = document.querySelector("#edit-endpoint").value;
        profile().secret = document.querySelector("#edit-secret").value;
        profile().status = "Ready"; state.editing = false; addEvent("profile", "Profile validated and saved in prototype memory"); render(); return;
      }
      if (target.dataset.command === "prepare") prepare();
      if (target.dataset.command === "run") run();
      if (target.dataset.command === "cancel") { clearInterval(runTimer); state.stage = "cancelled"; addEvent("cancel", "Cancellation acknowledged after current atomic operation"); render(); }
      if (target.dataset.command === "new") resetRun();
      if (target.dataset.command === "results") alert(`Prototype result\n\n${state.result ? state.result.output : "No result yet"}`);
    });

    document.addEventListener("change", event => {
      if (event.target.matches("[data-profile]")) { state.profileId = event.target.value; resetRun(); }
      if (event.target.matches("[data-map-destination]")) {
        const row = mappings().find(item => item.id === event.target.dataset.mapDestination);
        row.destination = event.target.value; state.mappingStatus = "changed"; addEvent("mapping", `${row.source} now maps to ${row.destination}`); render();
      }
      if (event.target.matches("[data-map-transform]")) {
        const row = mappings().find(item => item.id === event.target.dataset.mapTransform);
        row.transform = event.target.value; state.mappingStatus = "changed"; addEvent("mapping", `${row.source} now uses ${row.transform}`); render();
      }
    });

    document.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
      if (event.target.matches("input, textarea, select, [contenteditable]")) return;
      cycleVariant(event.key === "ArrowLeft" ? -1 : 1);
    });

    render();
  </script>
</body>
</html>
